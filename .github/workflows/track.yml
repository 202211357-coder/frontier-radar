name: track-frontier-models

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tracker/requirements.txt
      - name: Check official sources
        if: github.event_name != 'push'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker/track.py
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "frontier-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/feed.xml tracker/state.json
          git diff --cached --quiet || (git commit -m "radar: update $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
