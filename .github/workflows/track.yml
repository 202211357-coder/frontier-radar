name: track-frontier-models

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**"]

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # commit site/data.json, site/feed.xml, tracker/state.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r tracker/requirements.txt
      - name: Check official sources
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python tracker/track.py
      - name: Commit data changes
        run: |
          git config user.name "frontier-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/feed.xml tracker/state.json
          git diff --cached --quiet || (git commit -m "radar: update $(date -u +%F)" && git push)

  deploy:
    needs: [track]
    if: always() && (needs.track.result == 'success' || needs.track.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main              # include the data commit made by the track job
          persist-credentials: false
      - name: Add Content-Security-Policy for the public site
        run: python3 tracker/harden.py site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
